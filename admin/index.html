<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Photo manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Josefin+Sans:wght@300;400&display=swap">
<style>
:root{--bg:#0b0b0c;--surface:#141416;--line:#26262a;--text:#ecebe8;--muted:#a1a09a;--accent:#c9a96e;--bad:#e8a0a0;--s2:8px;--s3:16px;--s4:24px;--s5:40px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:300 1rem/1.6 'Josefin Sans',system-ui,sans-serif}
h1{font:300 clamp(2rem,1.5rem + 2vw,3rem)/1.1 'Cormorant Garamond',serif;margin:0}
main{max-width:1000px;margin:0 auto;padding:var(--s5) var(--s3)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);padding:var(--s2) var(--s3);cursor:pointer;border-radius:2px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b0b0c}
button.primary:hover{filter:brightness(1.1);color:#0b0b0c}
input,select{background:var(--surface);border:1px solid var(--line);padding:var(--s2) 12px;border-radius:2px;width:100%}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
header{display:flex;justify-content:space-between;align-items:end;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.login{max-width:360px;margin:12vh auto 0;display:grid;gap:var(--s3)}
.drop{display:block;width:100%;padding:var(--s5) var(--s3);border:1px dashed var(--muted);text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.bar{display:flex;gap:var(--s3);align-items:center;margin:var(--s3) 0 var(--s4)}
.bar select{width:auto}
.queue{display:grid;gap:var(--s2);margin-bottom:var(--s4)}
.q{display:flex;gap:var(--s3);align-items:center}
.q img{width:48px;height:48px;object-fit:cover;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s4)}
.card{background:var(--surface);border:1px solid var(--line);display:grid;gap:var(--s2);padding-bottom:var(--s3)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.card>*:not(img){margin:0 var(--s3)}
.row{display:flex;gap:var(--s2);justify-content:space-between;align-items:center}
.state{font-size:.85rem;color:var(--muted)}.state.live{color:var(--accent)}
.bad{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <form class="login" id="login">
    <h1>Photo manager</h1>
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Unlock</button>
    <p class="bad" id="loginErr" role="alert"></p>
  </form>

  <section id="app" hidden>
    <header>
      <div><h1>Photo manager</h1><p class="muted" id="count"></p></div>
      <button id="lock" type="button">Lock</button>
    </header>

    <button class="drop" id="drop" type="button">Drop photos here, or choose files</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div class="bar">
      <label for="cat" class="muted">Category for new uploads</label>
      <select id="cat"></select>
    </div>
    <div class="queue" id="queue"></div>
    <p class="muted" id="msg" role="status"></p>

    <div class="grid" id="grid"></div>
    <p class="muted" id="empty" hidden>No photos yet. Drop your first one above. It stays a draft until you publish it.</p>
  </section>
</main>

<script>
const CATS = ['Wildlife', 'Portrait', 'Street', 'Editorial'];
const $ = s => document.querySelector(s);
let photos = [];

const api = (path, opts = {}) => fetch('/api/admin' + path, {
  ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + (sessionStorage.token || '') }
});
const say = (t, bad) => { $('#msg').textContent = t; $('#msg').className = bad ? 'bad' : 'muted'; };

$('#cat').innerHTML = CATS.map(c => `<option>${c}</option>`).join('');

// ---- unlock / lock ----
function show(unlocked) { $('#login').hidden = unlocked; $('#app').hidden = !unlocked; }
function lock(err) { sessionStorage.removeItem('token'); show(false); $('#loginErr').textContent = err || ''; }

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  sessionStorage.token = $('#token').value.trim();
  $('#token').value = '';
  await refresh();
});
$('#lock').addEventListener('click', () => lock());

async function refresh() {
  const r = await api('/photos');
  if (r.status === 401) return lock('That token is not correct.');
  if (!r.ok) return lock('The server is not set up yet (error ' + r.status + ').');
  photos = await r.json();
  show(true); render();
}

// ---- list ----
function render() {
  $('#grid').replaceChildren(...photos.map(card));
  const live = photos.filter(p => p.status === 'published').length;
  $('#count').textContent = `${photos.length} photos, ${live} published`;
  $('#empty').hidden = photos.length > 0;
}

async function patch(id, body) {
  const r = await api('/photos/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) say('Could not save that change.', true);
  return r.ok;
}

function card(p) {
  const el = document.createElement('article'); el.className = 'card';
  const img = new Image(); img.alt = p.title;
  api('/img/' + p.id).then(r => r.blob()).then(b => { img.src = URL.createObjectURL(b); });

  const title = document.createElement('input');
  title.value = p.title; title.maxLength = 120; title.setAttribute('aria-label', 'Title');
  title.addEventListener('change', async () => { if (await patch(p.id, { title: title.value })) p.title = title.value; });

  const cat = document.createElement('select'); cat.setAttribute('aria-label', 'Category');
  cat.innerHTML = CATS.map(c => `<option${c === p.category ? ' selected' : ''}>${c}</option>`).join('');
  cat.addEventListener('change', async () => { if (await patch(p.id, { category: cat.value })) p.category = cat.value; });

  const state = document.createElement('span'); state.className = 'state';
  const toggle = document.createElement('button');
  const paint = () => {
    const live = p.status === 'published';
    state.textContent = live ? 'Published' : 'Draft';
    state.classList.toggle('live', live);
    toggle.textContent = live ? 'Unpublish' : 'Publish';
    toggle.className = live ? '' : 'primary';
    $('#count').textContent = `${photos.length} photos, ${photos.filter(x => x.status === 'published').length} published`;
  };
  toggle.addEventListener('click', async () => {
    const next = p.status === 'published' ? 'draft' : 'published';
    if (await patch(p.id, { status: next })) { p.status = next; paint(); say(next === 'published' ? 'Published.' : 'Unpublished.'); }
  });
  paint();

  const del = document.createElement('button'); del.textContent = 'Delete';
  del.addEventListener('click', async () => {
    if (!confirm(`Delete "${p.title}"? This removes the file for good.`)) return;
    const r = await api('/photos/' + p.id, { method: 'DELETE' });
    if (r.ok) { photos = photos.filter(x => x.id !== p.id); render(); say('Deleted.'); } else say('Could not delete.', true);
  });

  const r1 = document.createElement('div'); r1.className = 'row'; r1.append(state, toggle);
  const r2 = document.createElement('div'); r2.className = 'row'; r2.append(del);
  el.append(img, title, cat, r1, r2);
  return el;
}

// ---- upload: compress in the browser, preview, send ----
async function compress(file, max = 2000) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = new OffscreenCanvas(Math.round(bmp.width * k), Math.round(bmp.height * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.convertToBlob({ type: 'image/webp', quality: 0.82 }); // re-encoding also strips EXIF/GPS
}

function queueRow(name) {
  const row = document.createElement('div'); row.className = 'q';
  const img = new Image(); img.alt = '';
  const text = document.createElement('span'); text.textContent = name + ': compressing';
  row.append(img, text); $('#queue').append(row);
  return { img, set(t, bad) { text.textContent = name + ': ' + t; text.className = bad ? 'bad' : ''; }, row };
}

async function upload(files) {
  say('');
  for (const f of files) {
    if (!f.type.startsWith('image/')) { say(f.name + ' is not an image.', true); continue; }
    const q = queueRow(f.name);
    try {
      let blob = await compress(f);
      for (let qlt = 0.75; blob.size > 1_300_000 && qlt > 0.4; qlt -= 0.1) { // keep each photo small enough to store
        const bmp = await createImageBitmap(f); const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
        const c = new OffscreenCanvas(Math.round(bmp.width * k), Math.round(bmp.height * k));
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        blob = await c.convertToBlob({ type: 'image/webp', quality: qlt });
      }
      q.img.src = URL.createObjectURL(blob);
      q.set('uploading (' + Math.round(blob.size / 1024) + ' KB)');
      const thumbBlob = await compress(f, 800);
      const dims = await createImageBitmap(blob);
      const fd = new FormData();
      fd.append('file', blob, 'photo.webp');
      fd.append('thumb', thumbBlob, 'thumb.webp');
      fd.append('w', dims.width); fd.append('h', dims.height);
      fd.append('title', f.name.replace(/\.[^.]+$/, ''));
      fd.append('category', $('#cat').value);
      const r = await api('/photos', { method: 'POST', body: fd });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Upload failed.');
      q.set('saved as draft');
    } catch (e) { q.set(e.message, true); }
  }
  await refresh();
  setTimeout(() => $('#queue').replaceChildren(), 4000);
}

const drop = $('#drop'), fileInput = $('#file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { upload([...fileInput.files]); fileInput.value = ''; });
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload([...e.dataTransfer.files]));

if (sessionStorage.token) refresh();
</script>
</body>
</html>
